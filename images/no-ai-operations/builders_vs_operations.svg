<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="20" refX="16" refY="10" orient="auto">
      <path d="M 0 0 L 22 10 L 0 20 Z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="500" fill="#ffffff"/>

